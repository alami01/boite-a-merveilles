r:var(--ink);min-height:54px}.pair.chosen{border:2px solid var(--teal)}.pair.solved{background:#e4f3ec;border-color:#b3dbc6}.pair[disabled]{opacity:.65}.original{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.75;background:#fbfcfc;border:1px solid #e2e8ec;padding:16px;border-radius:12px;max-height:560px;overflow:auto}.original[hidden]{display:none}.option{display:block;width:100%;text-align:left;margin-top:7px;padding:10px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;font:inherit}.option.selected{background:#d9eef2;border-color:#126e70}.result{padding:10px;border-radius:9px;margin:10px 0;background:#eaf4fb}.success{background:#e4f5ed}.error{background:#fff0eb}textarea{width:100%;min-height:110px;border:1px solid #bdccd4;border-radius:10px;padding:12px;font:inherit;resize:vertical}.arabic{direction:rtl;font-family:Tahoma,Arial,sans-serif;font-size:19px}.foot{color:#637986;font-size:12px;margin:28px 0}button:focus-visible{outline:3px solid #f8b742;outline-offset:2px}@media(max-width:480px){.card{padding:15px}.layout{padding:10px}.grid{grid-template-columns:1fr}.wordgrid{grid-template-columns:1fr 1fr}} </style></head><body><header><h1>📘 La Boîte à merveilles</h1><p>Français · 1ère Bac · Réviser en français et en arabe</p></header><main class="layout" id="app"></main><script>const course=[{"week":1,"title":"Découvrir le roman","sessions":[{"title":"Entrer dans le roman","vocab":[["un enfant","طفل"],["une mère","أم"],["un père","أب"],["une maison","منزل"],["seul","وحيد"],["triste","حزين"],["regarder","ينظر"],["une boîte","علبة صندوق"]],"source":"La Boîte à merveilles\n\nCAHIER DE L'ÉLÈVE · SEMAINE 1 / 6\n\nPublic : Première Bac Lettres et Sciences humaines · Niveau 2 (débutante accompagnée)\n\nRythme : 5 séances de 45 à 60 min · 10 min de révision quotidienne\n\nPrénom : __________________________________ Classe : ____________________\n\nObjectif de la semaine : comprendre un texte court, connaître les personnages principaux, utiliser des phrases simples et répondre à des questions de compréhension.\n\nConsignes : Lis d’abord à voix haute. Entoure les mots connus. Demande de l’aide seulement après avoir essayé. Réponds en français, même avec une phrase courte.\n\nMon parcours\n\n□ Séance 1 : découvrir le livre □ Séance 2 : les personnages\n\n□ Séance 3 : comprendre les actions □ Séance 4 : raconter dans l’ordre\n\n□ Séance 5 : évaluation\n\nSÉANCE 1 / 5 · 45 à 60 min · Première Bac Lettres et Sciences humaines Entrer dans le roman\n\nSemaine 1 sur 6 Personnages · lieux · lecture\n\nJe peux : nommer le héros et ses parents, retrouver la ville, lire un texte de six phrases et donner deux informations.\n\nA. Je découvre l'œuvre\n\nTitre : La Boîte à merveilles · Auteur : Ahmed Sefrioui · Publication : 1954\n\nPersonnage principal : Sidi Mohammed, un jeune garçon qui vit à Fès.\n\nÀ l'oral : Qu'est-ce qu'une boîte ? Que peut-on y garder ?\n\nB. J'apprends huit mots\n\nMot / expressionالمعنى بالعربيةExemple ou remarque\n\nun enfantطفلSidi Mohammed est un enfant.\n\nune mèreأمLalla Zoubida est sa mère.\n\nun pèreأبSon père s’appelle Maâlem Abdeslam.\n\nune maisonمنزلIl vit dans une maison.\n\nseulوحيدIl se sent seul.\n\ntristeحزينIl est triste.\n\nregarderينظرIl regarde ses objets.\n\nune boîteعلبة / صندوقIl possède une boîte.\n\nC. Je lis et je comprends\n\nSidi Mohammed est un petit garçon. Il vit avec ses parents à Fès. Sa mère s'appelle Lalla Zoubida. Son père s'appelle Maâlem Abdeslam. Parfois, Sidi Mohammed se sent seul et triste. Il aime regarder les petits objets de sa boîte à merveilles.\n\nTexte pédagogique simpliᎲé, créé pour cette séance : ce n’est pas un extrait du roman.\n\nRéponds avec une phrase courte\n\n1. Comment s’appelle le garçon ?\n\n2. Dans quelle ville habite-t-il ?\n\n3. Comment s’appelle sa mère ?\n\n4. Comment se sent-il parfois ?\n\n5. Que regarde-t-il dans sa boîte ?\n\nD. Je construis des phrases\n\nComplète : « Sidi Mohammed est un ______. » / « Sa mère est ______. » / « Il habite à ______. »\n\nMini-devoir : relis le texte deux fois et apprends six mots.","session":1,"assessment":false,"page":1,"sourceNote":"Contenu repris du cahier PDF de la semaine 1. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Où vit Sidi Mohammed ?","options":["À Fès","À Paris","À Marrakech"],"answer":0}},{"title":"Qui est qui ?","vocab":[["il / elle","هو هي"],["les parents","الوالدان"],["un voisin / une voisine","جار جارة"],["aimer","يحب"],["avoir","يملك عنده"],["être","يكون"],["habiter","يسكن"],["dans","داخل في"]],"source":"SÉANCE 2 / 5 · 45 à 60 min · Première Bac Lettres et Sciences humaines Qui est qui ?\n\nSemaine 1 sur 6 Pronoms · être / avoir · famille\n\nJe peux : associer les personnages à leur rôle et construire une phrase avec être ou avoir.\n\nA. Retour sur la séance 1\n\nSans regarder : écris le prénom du garçon, le nom de sa mère et sa ville.\n\n1. Le garçon :\n\n2. Sa mère :\n\n3. La ville :\n\nB. Les mots du jour\n\nMot / expressionالمعنى بالعربيةExemple ou remarque\n\nil / elleهو / هيIl est petit. Elle est sa mère.\n\nles parentsالوالدانSes parents vivent avec lui.\n\nun voisin / une voisineجار / جارةUne voisine habite près de lui.\n\naimerيحبIl aime sa boîte.\n\navoirيملك / عندهIl a une boîte.\n\nêtreيكونIl est un garçon.\n\nhabiterيسكنIl habite à Fès.\n\ndansداخل / فيLes objets sont dans la boîte.\n\nC. Lecture guidée\n\nSidi Mohammed a six ans. Il habite à Fès avec sa famille. Lalla Zoubida est sa mère. Maâlem Abdeslam est son père. Le garçon aime sa boîte. Quand il est triste, il regarde ses petits objets.\n\nTexte pédagogique simpliᎲé. « Six ans » est une information du roman ; les phrases ne sont pas une citation.\n\nVrai ou faux ? Corrige les phrases fausses.\n\n1. Sidi Mohammed vit seul dans une autre ville.\n\n2. Lalla Zoubida est sa mère.\n\n3. Maâlem Abdeslam est son frère.\n\n4. Le garçon aime sa boîte.\n\nD. Petit point de langue\n\nÊTRE : je suis, tu es, il/elle est. AVOIR : j’ai, tu as, il/elle a. Exemples : Il est triste. Il a six ans.\n\nComplète par est ou a :\n\n1. Sidi Mohammed ______ six ans.\n\n2. Lalla Zoubida ______ sa mère.\n\n3. Le garçon ______ une boîte.\n\n4. Il ______ parfois triste.\n\nDevoir : écris trois phrases sur Sidi Mohammed avec « il est », « il a », « il habite ».","session":2,"assessment":false,"page":3,"sourceNote":"Contenu repris du cahier PDF de la semaine 1. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Qui est Lalla Zoubida ?","options":["Sa sœur","Sa mère","Sa voisine"],"answer":1}},{"title":"Lire pour comprendre","vocab":[["aujourd’hui","اليوم"],["parfois","أحيانا"],["souvent","غالبا"],["ouvrir","يفتح"],["fermer","يغلق"],["un objet","شيء غرض"],["calme","هادئ"],["se souvenir","يتذكر"]],"source":"SÉANCE 3 / 5 · 45 à 60 min · Première Bac Lettres et Sciences humaines Lire pour comprendre\n\nSemaine 1 sur 6 Qui ? Où ? Que fait-il ?\n\nJe peux : identiᎲer le personnage, le lieu, l’action et le sentiment dans un paragraphe de huit phrases.\n\nA. Vocabulaire de la lecture\n\nMot / expressionالمعنى بالعربيةExemple ou remarque\n\naujourd’huiاليومAujourd’hui, il reste à la maison.\n\nparfoisأحياناParfois, il est triste.\n\nsouventغالباIl regarde souvent sa boîte.\n\nouvrirيفتحIl ouvre la boîte.\n\nfermerيغلقIl ferme la boîte.\n\nun objetشيء / غرضIl garde un objet.\n\ncalmeهادئLa pièce est calme.\n\nse souvenirيتذكرIl se souvient de son enfance.\n\nB. Lecture\n\nAujourd'hui, Sidi Mohammed reste à la maison. La pièce est calme. Le garçon pense à ses amis. Il se sent un peu seul. Il prend sa boîte à merveilles. Il l'ouvre doucement. Il regarde les objets et imagine des histoires. Après quelques minutes, il se sent mieux.\n\nSituation Ꮂctive d’apprentissage inspirée des thèmes du roman ; ne correspond pas à un épisode attesté tel quel.\n\nC. Compréhension\n\n1. Où est Sidi Mohammed ?\n\n2. Quel est son sentiment au début ?\n\n3. Quel objet prend-il ?\n\n4. Cite deux verbes qui montrent ses actions.\n\n5. Comment se sent-il à la Ꮂn ?\n\n6. Pourquoi, selon toi, la boîte est-elle importante pour lui ?\n\nD. Répondre avec une phrase complète\n\nModèle : Où est le garçon ? → Le garçon est à la maison.\n\n1. Que regarde-t-il ? →\n\n2. Que fait-il avec sa boîte ? →\n\nDevoir : choisis cinq mots du tableau et écris cinq phrases très simples.","session":3,"assessment":false,"page":5,"sourceNote":"Contenu repris du cahier PDF de la semaine 1. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Quel mot décrit un sentiment du garçon ?","options":["Triste","Rapide","Haut"],"answer":0}},{"title":"Mettre les idées dans l’ordre","vocab":[["d’abord","أولا"],["ensuite","بعد ذلك"],["puis","ثم"],["enᎲn","أخيرا"],["avant","قبل"],["après","بعد"],["content","سعيد"],["raconter","يحكي يسرد"]],"source":"SÉANCE 4 / 5 · 45 à 60 min · Première Bac Lettres et Sciences humaines Mettre les idées dans l’ordre\n\nSemaine 1 sur 6 Chronologie · connecteurs · rédaction\n\nJe peux : raconter un petit événement dans l’ordre et écrire un paragraphe de quatre phrases.\n\nA. Les mots pour raconter\n\nMot / expressionالمعنى بالعربيةExemple ou remarque\n\nd’abordأولاD’abord, il rentre.\n\nensuiteبعد ذلكEnsuite, il ouvre la boîte.\n\npuisثمPuis, il regarde les objets.\n\nenᎲnأخيراEnᎲn, il ferme la boîte.\n\navantقبلAvant le repas.\n\naprèsبعدAprès le repas.\n\ncontentسعيدIl est content.\n\nraconterيحكي / يسردJe raconte une histoire.\n\nB. Une histoire en quatre étapes\n\nSidi Mohammed rentre à la maison. Il trouve sa boîte sur une étagère. Il l'ouvre et regarde ses petits objets. EnᎲn, il ferme la boîte et la range.\n\nTexte pédagogique Ꮂctif, non extrait de l'œuvre.\n\nRemets les événements dans le bon ordre (1 à 4)\n\n1. _____ Il ferme la boîte.\n\n2. _____ Il rentre à la maison.\n\n3. _____ Il regarde ses objets.\n\n4. _____ Il trouve sa boîte.\n\nC. Compléter un récit\n\nMots à utiliser : D’abord — Ensuite — Puis — EnᎮn.\n\n____________, Sidi Mohammed rentre à la maison. ____________, il trouve sa boîte. ____________, il regarde ses objets. ____________, il range sa boîte.\n\nD. À toi d’écrire (4 phrases)\n\nRaconte un moment de ta journée en utilisant les mêmes quatre mots. Tu peux choisir : je me réveille, je prends mon petit-déjeuner, je vais au lycée, je rentre chez moi.\n\nDevoir : relis ton paragraphe et souligne les quatre connecteurs.","session":4,"assessment":false,"page":7,"sourceNote":"Contenu repris du cahier PDF de la semaine 1. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Quel mot indique une première étape ?","options":["Enfin","D’abord","Mais"],"answer":1}},{"title":"Je fais le point","vocab":[],"source":"SÉANCE 5 / 5 · 45 à 60 min · Première Bac Lettres et Sciences humaines Je fais le point\n\nSemaine 1 sur 6 Évaluation · préparation au régional\n\nJe peux : comprendre un texte inédit, répondre à des questions, utiliser être/avoir et écrire un court paragraphe. Évaluation de 35 min : lecture (10 pts), langue (4 pts), écriture (6 pts). Correction accompagnée : 10 à 25 min.\n\nA. Texte de lecture\n\nSidi Mohammed vit à Fès avec ses parents. Il a six ans. Sa mère s'appelle Lalla Zoubida. Le garçon se sent parfois seul. Quand il est triste, il pense à sa boîte à merveilles. Il garde de petits objets dans cette boîte. Pour lui, ces objets sont précieux. Ils l'aident à imaginer un monde diᎱérent.\n\nTexte d’évaluation simpliᎲé, créé pour la classe ; ce n’est pas un extrait du roman.\n\nB. Compréhension — 10 points\n\n1. (2 pts) Comment s’appelle la mère de Sidi Mohammed ?\n\n2. (2 pts) Où vit l’enfant ?\n\n3. (2 pts) Quel âge a-t-il ?\n\n4. (2 pts) Quand pense-t-il à sa boîte ?\n\n5. (2 pts) Pourquoi les objets sont-ils importants pour lui ?\n\nC. Langue — 4 points\n\nComplète avec est ou a (1 point chacun).\n\n1. Sidi Mohammed ______ six ans.\n\n2. Il ______ parfois seul.\n\n3. Lalla Zoubida ______ sa mère.\n\n4. Le garçon ______ une boîte.\n\nD. Expression écrite — 6 points\n\nSujet : Présente un objet que tu aimes en 4 à 6 phrases simples. Explique ce que c’est, où il se trouve, et pourquoi il est important pour toi.\n\nTu peux commencer ainsi : « J’ai un objet que j’aime beaucoup. C’est… »\n\nBilan de la semaine : Je comprends un petit texte □ Je construis une phrase □ Je raconte dans l’ordre □","session":5,"assessment":true,"page":9,"sourceNote":"Contenu repris du cahier PDF de la semaine 1. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Quel auteur a écrit le roman ?","options":["Victor Hugo","Ahmed Sefrioui","Jean Anouilh"],"answer":1}}]},{"week":2,"title":"Narrateur, lieux et sentiments","sessions":[{"title":"Qui raconte ?","vocab":[["le soir","المساء"],["dormir","ينام"],["penser à","يفكر في"],["la solitude","الوحدة"],["se souvenir","يتذكر"],["je","أنا"]],"source":"SÉANCE 1 / 5 · 45 à 60 MINUTES Qui raconte ?\n\nSemaine 2 sur 6 Je · solitude · narrateur\n\nJe peux : comprendre qui parle dans un récit, repérer le pronom « je » et dire ce que\n\nressent le narrateur.\n\n1 · Je me souviens\n\nComplète sans regarder la semaine précédente :\n\na) Le héros enfant s’appelle :\n\nb) Il vit dans la ville de :\n\nc) Il a environ : ______ ans.\n\n2 · Mots nouveaux\n\nFrançaisبالعربيةExemple\n\nle soirالمساءLe soir, je lis.\n\ndormirينامJe dors la nuit.\n\npenser àيفكر فيJe pense à ma famille.\n\nla solitudeالوحدةIl ressent la solitude.\n\nse souvenirيتذكرIl se souvient du passé.\n\njeأناJe raconte ma vie.\n\n3 · Je lis une phrase du roman\n\n« Je songe à ma solitude et j’en sens tout le poids. »\n\nAhmed Sefrioui, La Boîte à merveilles, chapitre I, p. 1 du PDF de référence. Extrait authentique (court).\n\nAide : « Je songe » = « je pense » ( « .)أفكرMa solitude » = « .وحدتيTout le poids » exprime\n\nque ce sentiment est difficile à supporter.\n\nJe comprends\n\n1. Entoure le pronom personnel utilisé : je / il / nous.\n\n2. Qui parle dans cette phrase : un personnage qui raconte sa vie ou un voisin ?\n\n3. Quel sentiment apparaît ?\n\n4. Recopie deux mots qui montrent ce sentiment.\n\n4 · Je construis\n\nAvec le modèle « Je pense à ... », écris deux phrases personnelles.\n\nÀ la maison (10 min) : relire l’extrait trois fois, apprendre quatre mots, écrire « Je suis… »\n\net « Je pense à… ».","session":1,"assessment":false,"page":2,"sourceNote":"Contenu repris du cahier PDF de la semaine 2. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"À quoi renvoie « je » dans le récit ?","options":["Au narrateur","À tous les habitants","À la ville"],"answer":0}},{"title":"Où se passe le récit ?","vocab":[["habiter","يسكن"],["une maison","منزل دار"],["une voyante","عرّافة"],["un étage","طابق"],["un voisin","جار"],["nous","نحن"]],"source":"SÉANCE 2 / 5 · 45 à 60 MINUTES Où se passe le récit ?\n\nSemaine 2 sur 6 Lieu · Dar Chouafa\n\nJe peux : identifier un lieu, comprendre le mot « voyante » et répondre à « Où ? » en une\n\nphrase.\n\n1 · Réactivation\n\nComplète : Dans le roman, le narrateur pense à sa ____________.\n\n2 · Vocabulaire\n\nFrançaisبالعربيةExemple\n\nhabiterيسكنNous habitons à Fès.\n\nune maisonمنزل / دارLa famille vit dans une maison.\n\nune voyanteعرّافةLa voyante reçoit des visiteuses.\n\nun étageطابقLa chambre est au deuxième étage.\n\nun voisinجارIl habite près de moi.\n\nnousنحنNous sommes à la maison.\n\n3 · Je lis le roman\n\n« Nous habitions Dar Chouafa, la maison de la voyante. »\n\nAhmed Sefrioui, La Boîte à merveilles, chapitre I, p. 1 du PDF de référence. Extrait authentique (court).\n\nAide : « Nous » désigne le narrateur et sa famille. « Habitions » est une forme du verbe\n\nhabiter au passé : .كنا نسكن\n\nQuestions de compréhension\n\n1. Quel est le nom de la maison ?\n\n2. Qui est la Chouafa ?\n\n3. À quoi correspond « nous » dans cette phrase ?\n\n4. Recopie le mot du texte qui signifie « maison » dans le nom du lieu.\n\n4 · Grammaire simple : habiter\n\nAujourd’hui : nous habitons · Dans le souvenir : nous habitions.\n\nPour répondre, utilise : La famille habite à… / La famille habitait à…\n\na) Aujourd’hui, nous ____________ à Fès. (habitons / habitions)\n\nb) Dans le souvenir, nous ____________ Dar Chouafa. (habitons / habitions)\n\n5 · Mini-expression\n\nÉcris trois phrases sur ta maison ou ton quartier avec : « J’habite… », « Dans ma maison… »,\n\n« Près de chez moi… ».\n\nÀ la maison : lire l’extrait, revoir six mots, dire à l’oral où habite le narrateur.","session":2,"assessment":false,"page":4,"sourceNote":"Contenu repris du cahier PDF de la semaine 2. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Dans quelle maison vit la famille ?","options":["Dar Chouafa","Une école","Un palais"],"answer":0}},{"title":"L’école coranique","vocab":[["se lever","يستيقظ ينهض"],["de bonne heure","باكرا"],["aller","يذهب"],["le Msid","المسيد الكتاب"],["l’école","المدرسة"],["chaque matin","كل صباح"]],"source":"SÉANCE 3 / 5 · 45 à 60 MINUTES L’école coranique\n\nSemaine 2 sur 6 Msid · habitudes · temps\n\nJe peux : identifier une habitude de l’enfance, repérer où va Sidi Mohammed et reconnaître\n\ndeux mots du temps.\n\n1 · Je retrouve les informations\n\n1. Comment s’appelle la maison où vit le narrateur ?\n\n2. Écris une phrase contenant « nous habitons » :\n\n2 · Vocabulaire du jour\n\nFrançaisبالعربيةExemple\n\nse leverيستيقظ / ينهضJe me lève tôt.\n\nde bonne heureباكراIl sort de bonne heure.\n\nallerيذهبJe vais à l’école.\n\nle Msidالمسيد / الكتابLe Msid est une école coranique.\n\nl’écoleالمدرسةJe vais à l’école.\n\nchaque matinكل صباحChaque matin, je lis.\n\n3 · Lecture de l’œuvre\n\n« Je me levais de bonne heure pour aller au Msid, école Coranique située à deux\n\npas de la maison. »\n\nAhmed Sefrioui, La Boîte à merveilles, chapitre I, p. 1 du PDF de référence. Extrait authentique (court).\n\nAide : « Je me levais » = « .كنت أستيقظ/أنهضÀ deux pas de la maison » signifie tout près de\n\nla maison (.)قريب جدًا من البيت\n\nJe réponds\n\n1. Où allait l’enfant ?\n\n2. À quel moment se levait-il ?\n\n3. Le Msid était-il loin de la maison ? Justifie avec trois mots du texte.\n\n4. Dans « Je me levais », est-ce une habitude passée ou une action qui se produit maintenant ?\n\n4 · J’observe la langue\n\nAujourd’hui : je me lève / je vais au lycée.\n\nDans le passé : je me levais / j’allais au Msid.\n\nL’imparfait peut raconter une habitude passée.\n\na) Aujourd’hui, je me ____________ tôt. (lève / levais)\n\nb) Quand j’étais petit(e), je me ____________ tôt. (lève / levais)\n\n5 · Ma journée en trois phrases\n\nÉcris : « Le matin, je… » / « Ensuite, je… » / « Enfin, je… ».\n\nÀ la maison : réciter les six mots ; raconter deux habitudes du matin.","session":3,"assessment":false,"page":6,"sourceNote":"Contenu repris du cahier PDF de la semaine 2. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Le Msid est…","options":["Un marché","Une école coranique","Un hôpital"],"answer":1}},{"title":"Un enfant seul","vocab":[],"source":"SÉANCE 4 / 5 · 45 à 60 MINUTES Un enfant seul\n\nSemaine 2 sur 6 Sentiments · négation · justification\n\nJe peux : reconnaître les sentiments exprimés et citer des mots du texte pour justifier une\n\nréponse.\n\n1 · Je revois le vocabulaire\n\nRelie dans ton cahier : « solitaire », « heureux », « triste » et leurs significations en arabe : / وحيد\n\n.سعيد / حزين\n\n2 · Je lis le roman\n\n« Je n’étais ni heureux, ni malheureux. J’étais un enfant seul. »\n\nAhmed Sefrioui, La Boîte à merveilles, chapitre I, p. 2 du PDF de référence. Extrait authentique (court).\n\n3 · Je comprends\n\n1. Le narrateur dit-il qu’il était heureux ? Réponds par oui ou non.\n\n2. Comment se décrit-il dans la deuxième phrase ?\n\n3. Recopie la négation utilisée dans la première phrase.\n\n4. Quelle réponse est justifiée par le texte ? A. Il avait beaucoup d’amis. B. Il était un enfant\n\nseul. C. Il aimait les disputes.\n\n4 · La négation « ni… ni… »\n\nNi… ni… = …ال… وال\n\nExemple : « Il n’est ni grand ni petit. » Cela veut dire qu’il n’est pas grand et qu’il n’est pas\n\npetit.\n\na) Complète : Je ne suis ______ fatigué(e) ______ malade.\n\nb) Reformule : « Il n’était pas heureux et il n’était pas malheureux. » → Il n’était ______ heureux\n\n______ malheureux.\n\n5 · Première question de type examen régional\n\nConsigne : Quel sentiment domine dans ce passage ? Justifie par une expression du texte.\n\nModèle de réponse : Le sentiment dominant est ____________, comme le montre\n\nl’expression « ____________ ».\n\n6 · Expression personnelle\n\nÉcris 3 à 4 phrases : Que fais-tu quand tu te sens seul(e) ou triste ?\n\nÀ la maison : revoir les quatre très courts passages du chapitre I et apprendre la structure\n\n« Je pense que… parce que… ».","session":4,"assessment":false,"page":8,"sourceNote":"Contenu repris du cahier PDF de la semaine 2. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Quel mot désigne la solitude ?","options":["الوحدة","الفرح","الحرارة"],"answer":0}},{"title":"Je m’évalue","vocab":[],"source":"SÉANCE 5 / 5 · 45 à 60 MINUTES Je m’évalue\n\nSemaine 2 sur 6 Évaluation formative · 20 points\n\nDurée conseillée : 35 à 40 min d’évaluation + 10 à 20 min de correction accompagnée.\n\nCe contrôle prépare les compétences de base, ce n’est pas un sujet régional complet.\n\nA · Texte de lecture\n\nSidi Mohammed est un enfant de six ans. Il habite avec sa famille à Dar Chouafa. Le matin, il va au Msid. Il se sent souvent seul. Quand il pense à son enfance, il se souvient de sa maison et de son école.\n\nTexte pédagogique original fondé sur des informations du chapitre I. Il ne s’agit pas d’un passage cité du roman.\n\nB · Compréhension / 10 points\n\n1. (2 pts) Quel âge a Sidi Mohammed ?\n\n2. (2 pts) Comment s’appelle sa maison ?\n\n3. (2 pts) Où va-t-il le matin ?\n\n4. (2 pts) Comment se sent-il souvent ?\n\n5. (2 pts) Cite deux lieux mentionnés dans le texte.\n\nC · Langue / 4 points\n\n1. (1 pt) Complète : Nous ____________ à Fès. (habitons / habitions) [aujourd’hui]\n\n2. (1 pt) Complète : Quand j’étais petit, je me ____________ tôt. (lève / levais)\n\n3. (1 pt) Complète : Je ne suis ______ heureux ______ triste.\n\n4. (1 pt) Recopie un verbe conjugué au présent dans le texte de lecture.\n\nD · Expression écrite / 6 points\n\nSujet : Présente un souvenir de ton enfance en 4 à 6 phrases simples. Indique le lieu, une\n\npersonne et un sentiment. Tu peux utiliser : « Quand j’étais petit(e)… », « J’habitais… », « Je me\n\nsentais… ».\n\nAutoévaluation\n\n□ Je reconnais « je / nous ». □ Je sais dire où se déroule le récit.\n\n□ Je comprends la solitude. □ Je justifie avec un mot du texte.","session":5,"assessment":true,"page":10,"sourceNote":"Contenu repris du cahier PDF de la semaine 2. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Que signifie « justifier » ?","options":["Donner un indice","Inventer","Recopier tout le chapitre"],"answer":0}}]},{"week":3,"title":"Les habitants de Dar Chouafa","sessions":[{"title":"Qui habite au premier étage ?","vocab":[["une voisine","جارة"],["une fille","ابنة بنت"],["un étage","طابق"],["le mari","الزوج"],["aimer","يحب"]],"source":"SEMAINE 3/6 · SÉANCE 1/5 · 45 À 60 MIN Qui habite au premier étage ?\n\nPersonnages · relations\n\nÀ la fin, je sais : nommer Rahma, Driss El Aouad et Zineb, puis dire leur lien de parenté.\n\n1. Je me rappelle\n\n1. Où habite Sidi Mohammed ?\n\n2. Quel est le nom de son école coranique ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nune voisineجارةRahma est une voisine.\n\nune filleابنة / بنتZineb est leur fille.\n\nun étageطابقLa famille vit au premier étage.\n\nle mariالزوجDriss est le mari de Rahma.\n\naimerيحبJ’aime ma famille.\n\n3. Je lis et je comprends\n\nAu premier étage de Dar Chouafa vivent Driss El Aouad, sa femme Rahma et leur fille Zineb. Zineb est un peu plus âgée que Sidi Mohammed. Celui-ci ne l’aime pas.\n\nReformulation pédagogique du chapitre I (non extraite mot à mot).\n\n4. Questions de lecture\n\n1. À quel étage habite Rahma ?\n\n2. Comment s’appelle son mari ?\n\n3. Qui est Zineb ?\n\n4. Sidi Mohammed aime-t-il Zineb ? Justifie par la dernière phrase.\n\n5. Je travaille la langue\n\nPour présenter une relation : « X est la fille de Y ». Pour nier : « Il ne l’aime pas ».\n\n1. Complète : Zineb est la ______ de Rahma.\n\n2. Transforme : « Il aime Zineb. » à la forme négative.\n\n3. Écris : « Rahma est la femme de ... »\n\n6. J’écris\n\nPrésente la famille de Rahma en quatre phrases simples.\n\nTravail personnel (10 à 15 min) : Apprendre les noms de trois personnages et écrire deux phrases de parenté.","session":1,"assessment":false,"page":2,"sourceNote":"Contenu repris du cahier PDF de la semaine 3. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Qui est la fille de Rahma ?","options":["Zineb","Lalla Zoubida","Lalla Aïcha"],"answer":0}},{"title":"Les habitants du deuxième étage","vocab":[["partager","يتقاسم"],["une fenêtre","نافذة"],["un patio","فناء داخلي"],["au-dessus","فوق"],["au-dessous","تحت"]],"source":"SEMAINE 3/6 · SÉANCE 2/5 · 45 À 60 MIN Les habitants du deuxième étage\n\nLieux · repérage\n\nÀ la fin, je sais : distinguer les occupants du deuxième étage et utiliser « au-dessus / au- dessous ».\n\n1. Je me rappelle\n\n1. Qui est la fille de Rahma ?\n\n2. Quelle phrase montre que Sidi Mohammed n’apprécie pas Zineb ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\npartagerيتقاسمNous partageons un étage.\n\nune fenêtreنافذةJe vois la cour par la fenêtre.\n\nun patioفناء داخليLe patio est au milieu de la maison.\n\nau-dessusفوقLe deuxième étage est au-dessus du premier.\n\nau-dessousتحتLe premier est au-dessous du deuxième.\n\n3. Je lis et je comprends\n\nAu deuxième étage, Sidi Mohammed vit avec son père et sa mère, Lalla Zoubida. La famille partage cet étage avec Fatma Bziouya. Les fenêtres donnent sur un patio.\n\nReformulation pédagogique d’informations du chapitre I.\n\n4. Questions de lecture\n\n1. Qui vit avec Sidi Mohammed ?\n\n2. Comment s’appelle la voisine du deuxième étage ?\n\n3. Sur quoi donnent les fenêtres ?\n\n4. Où se trouve le deuxième étage par rapport au premier ?\n\n5. Je travaille la langue\n\nPour situer : « au premier étage », « au deuxième étage », « au-dessus de », « au-dessous de ».\n\n1. Complète : Fatma Bziouya habite ______ deuxième étage.\n\n2. Complète : Le deuxième étage est ______ du premier.\n\n3. Donne le contraire de « au-dessus ».\n\n6. J’écris\n\nDécris en 4 phrases les deux étages de Dar Chouafa étudiés cette semaine.\n\nTravail personnel (10 à 15 min) : Dessiner un petit plan légendé des habitants des deux étages.","session":2,"assessment":false,"page":4,"sourceNote":"Contenu repris du cahier PDF de la semaine 3. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Le mot « étage » désigne…","options":["Un niveau d’un bâtiment","Un livre","Une rue"],"answer":0}},{"title":"La Chouafa et les visiteurs","vocab":[["une voyante","عرّافة"],["consulter","يستشير"],["une cliente","زبونة"],["le rez-de-chaussée","الطابق األرضي"],["recevoir","يستقبل"]],"source":"SEMAINE 3/6 · SÉANCE 3/5 · 45 À 60 MIN La Chouafa et les visiteurs\n\nActions · mots du texte\n\nÀ la fin, je sais : comprendre ce que fait une voyante et identifier les visiteurs de la maison.\n\n1. Je me rappelle\n\n1. Qu’est-ce qu’un patio ?\n\n2. Quelle voisine partage le deuxième étage avec la famille de Sidi Mohammed ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nune voyanteعرّافةLa Chouafa est une voyante.\n\nconsulterيستشيرDes femmes viennent la consulter.\n\nune clienteزبونةUne cliente entre.\n\nle rez-de-chausséeالطابق األرضيLa voyante vit au rez-de-chaussée.\n\nrecevoirيستقبلElle reçoit des visiteuses.\n\n3. Je lis et je comprends\n\nAu rez-de-chaussée de Dar Chouafa habite une voyante connue. Des femmes de différents quartiers viennent la consulter. La maison accueille des visiteuses.\n\nReformulation pédagogique du chapitre I.\n\n4. Questions de lecture\n\n1. À quel étage vit la Chouafa ?\n\n2. Qui vient la consulter ?\n\n3. D’où viennent ces femmes ?\n\n4. Recopie un verbe qui signifie « demander conseil ».\n\n5. Je travaille la langue\n\nLe verbe au présent exprime ici une action habituelle : « elle reçoit », « elles viennent ».\n\n1. Complète : La Chouafa ______ au rez-de-chaussée. (habite / habitent)\n\n2. Complète : Des femmes ______ la voyante. (consulte / consultent)\n\n3. Transforme au singulier : « Des femmes viennent. »\n\n6. J’écris\n\nPrésente en 4 phrases la Chouafa et sa maison.\n\nTravail personnel (10 à 15 min) : Revoir cinq mots et faire une phrase avec « consulter ».","session":3,"assessment":false,"page":6,"sourceNote":"Contenu repris du cahier PDF de la semaine 3. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Que fait une voyante selon le récit ?","options":["Elle reçoit des visiteuses","Elle enseigne au Msid","Elle tient le bain"],"answer":0}},{"title":"Comparer les personnages","vocab":[["un personnage","شخصية"],["un narrateur","السارد"],["un lien","عالقة"],["décrire","يصف"],["justifier","يبرر"]],"source":"SEMAINE 3/6 · SÉANCE 4/5 · 45 À 60 MIN Comparer les personnages\n\nTableau · justification\n\nÀ la fin, je sais : construire une petite fiche de personnage et distinguer les personnages d’un récit.\n\n1. Je me rappelle\n\n1. Qui est Zineb ?\n\n2. Où vit la Chouafa ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nun personnageشخصيةZineb est un personnage.\n\nun narrateurالساردLe narrateur raconte l’histoire.\n\nun lienعالقةIl existe un lien familial.\n\ndécrireيصفJe décris un personnage.\n\njustifierيبررJe justifie ma réponse.\n\n3. Je lis et je comprends\n\nSidi Mohammed raconte des souvenirs de son enfance. Il parle de ses parents et des habitants de Dar Chouafa : Rahma, Zineb, Fatma Bziouya et la voyante. Tous appartiennent à son univers quotidien.\n\nTexte de synthèse pédagogique à partir du chapitre I.\n\n4. Questions de lecture\n\n1. Qui raconte les souvenirs ?\n\n2. Cite deux personnages féminins du passage.\n\n3. Donne le nom d’un membre de la famille de Sidi Mohammed.\n\n4. Quel mot montre que l’histoire parle du passé ?\n\n5. Je travaille la langue\n\nUne réponse justifiée comporte une information et un indice : « C’est un souvenir, car le texte dit “enfance”. »\n\n1. Complète : « Le narrateur ______ ses souvenirs. » (raconte / racontent)\n\n2. Transforme : « Rahma est une voisine. » → « Rahma et Fatma Bziouya sont des ... »\n\n3. Écris une phrase contenant « car ».\n\n6. J’écris\n\nRédige une fiche de présentation de Zineb (4 phrases).\n\nTravail personnel (10 à 15 min) : Relire les quatre passages et revoir les liens entre personnages.","session":4,"assessment":false,"page":8,"sourceNote":"Contenu repris du cahier PDF de la semaine 3. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Un narrateur est…","options":["Celui qui raconte","Un personnage obligatoirement méchant","Un lieu"],"answer":0}},{"title":"Évaluation : habitants et lieux","vocab":[["une famille","أسرة"],["un voisin","جار"],["un étage","طابق"],["raconter","يحكي"],["une cour","فناء"]],"source":"SEMAINE 3/6 · SÉANCE 5/5 · 45 À 60 MIN Évaluation : habitants et lieux\n\nÉvaluation /20\n\nÀ la fin, je sais : répondre à des questions de compréhension, utiliser les lieux et présenter un personnage.\n\n1. Je me rappelle\n\n1. Écris deux noms de personnages du roman.\n\n2. Dans quelle ville se déroule l’enfance du narrateur ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nune familleأسرةLa famille vit ensemble.\n\nun voisinجارJ’ai un voisin.\n\nun étageطابقJe monte à l’étage.\n\nraconterيحكيJe raconte un souvenir.\n\nune courفناءUne cour se trouve dans la maison.\n\n3. Je lis et je comprends\n\nDans Dar Chouafa, plusieurs familles vivent ensemble. La Chouafa habite au rez-de- chaussée. Rahma vit au premier étage avec son mari Driss et sa fille Zineb. Au deuxième étage vivent Sidi Mohammed, ses parents et Fatma Bziouya.\n\nTexte inédit pour l’évaluation (pas un extrait du roman).\n\n4. Questions de lecture\n\n1. (2 pts) Où habite la Chouafa ?\n\n2. (2 pts) Qui est Driss ?\n\n3. (2 pts) Comment s’appelle la fille de Rahma ?\n\n4. (2 pts) Où habite Sidi Mohammed ?\n\n5. (2 pts) Cite une voisine de la famille.\n\n5. Je travaille la langue\n\nBARÈME : compréhension /10 (5 questions de 2 pts) ; langue /4 (2+1+1) ; expression /6.\n\n1. (2 pts) Complète : Zineb est la ______ de Rahma et Driss est son ______.\n\n2. (1 pt) Complète : Sidi Mohammed habite ______ deuxième étage.\n\n3. (1 pt) Écris le contraire de « au-dessus ».\n\n6. J’écris\n\n(6 pts) Présente en 4 à 6 phrases un personnage de Dar Chouafa : nom, famille, étage et une information sur lui.\n\nTravail personnel (10 à 15 min) : Reprendre les erreurs de l’évaluation ; préparer les mots liés aux émotions.","session":5,"assessment":true,"page":10,"sourceNote":"Contenu repris du cahier PDF de la semaine 3. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Quelle expression situe un personnage ?","options":["Au premier étage","Très triste","Hier soir"],"answer":0}}]},{"week":4,"title":"Solitude et imaginaire","sessions":[{"title":"La solitude du petit garçon","vocab":[["seul","وحيد"],["la solitude","الوحدة"],["un ami","صديق"],["attendre","ينتظر"],["un oiseau","طائر"]],"source":"SEMAINE 4/6 · SÉANCE 1/5 · 45 À 60 MIN La solitude du petit garçon\n\nSentiments · indices\n\nÀ la fin, je sais : comprendre le sentiment de solitude et repérer un indice dans un texte.\n\n1. Je me rappelle\n\n1. Qui raconte les souvenirs ?\n\n2. Quel personnage est la fille de Rahma ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nseulوحيدJe suis seul.\n\nla solitudeالوحدةIl ressent la solitude.\n\nun amiصديقIl cherche un ami.\n\nattendreينتظرIl attend un oiseau.\n\nun oiseauطائرLe moineau est un oiseau.\n\n3. Je lis et je comprends\n\nDans ses souvenirs, Sidi Mohammed se voit à six ans. Il veut attraper un petit moineau pour en faire son compagnon. Le moineau ne vient pas. L’enfant retourne chez lui avec de la tristesse.\n\nReformulation pédagogique du tout début du chapitre I.\n\n4. Questions de lecture\n\n1. Quel âge a l’enfant dans ce souvenir ?\n\n2. Quel animal attend-il ?\n\n3. Pourquoi veut-il cet animal ?\n\n4. L’oiseau vient-il ?\n\n5. Quel sentiment éprouve l’enfant à la fin ?\n\n5. Je travaille la langue\n\nPour répondre à « Pourquoi ? » on peut employer « parce que » : « Il attend un oiseau parce qu’il veut un compagnon. »\n\n1. Complète : Il attend l’oiseau ______ il veut un ami.\n\n2. Transforme au négatif : « L’oiseau vient. »\n\n3. Écris une phrase avec « seul ».\n\n6. J’écris\n\nEn quatre phrases, explique ce que fait l’enfant et comment il se sent.\n\nTravail personnel (10 à 15 min) : Relire le texte et mémoriser « parce que ».","session":1,"assessment":false,"page":2,"sourceNote":"Contenu repris du cahier PDF de la semaine 4. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Quel sentiment revient chez Sidi Mohammed ?","options":["La solitude","La fierté","La colère permanente"],"answer":0}},{"title":"Les rêves de Sidi Mohammed","vocab":[["un rêve","حلم"],["imaginer","يتخيل"],["une histoire","قصة"],["un monde","عالم"],["le réel","الواقع"]],"source":"SEMAINE 4/6 · SÉANCE 2/5 · 45 À 60 MIN Les rêves de Sidi Mohammed\n\nImaginaire · réel\n\nÀ la fin, je sais : distinguer les faits réels des idées imaginées dans les souvenirs.\n\n1. Je me rappelle\n\n1. Pourquoi l’enfant attend-il un moineau ?\n\n2. Le moineau arrive-t-il ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nun rêveحلمJe fais un rêve.\n\nimaginerيتخيلIl imagine un autre monde.\n\nune histoireقصةIl aime les histoires.\n\nun mondeعالمIl imagine un monde merveilleux.\n\nle réelالواقعLe réel est différent du rêve.\n\n3. Je lis et je comprends\n\nSidi Mohammed aime rêver. Les autres enfants s’amusent souvent ensemble, mais lui imagine des mondes mystérieux. Il écoute les histoires extraordinaires que lui raconte Abdallah, l’épicier.\n\nReformulation pédagogique du chapitre I.\n\n4. Questions de lecture\n\n1. Qu’aime faire Sidi Mohammed ?\n\n2. Les autres enfants jouent-ils souvent ensemble ?\n\n3. Qui lui raconte des histoires ?\n\n4. Quel est le métier d’Abdallah ?\n\n5. Je travaille la langue\n\n« Mais » marque une opposition : « Les enfants jouent, mais Sidi Mohammed préfère rêver ».\n\n1. Complète : Les enfants jouent, ______ il préfère rêver.\n\n2. Écris une phrase avec « imagine ».\n\n3. Donne le contraire de « réel » dans ce contexte.\n\n6. J’écris\n\nÉcris quatre phrases pour expliquer la différence entre un jeu et un rêve.\n\nTravail personnel (10 à 15 min) : Écrire trois mots qui appartiennent au monde du rêve.","session":2,"assessment":false,"page":4,"sourceNote":"Contenu repris du cahier PDF de la semaine 4. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Quel mot désigne ce qui n’est pas réel ?","options":["Imaginaire","Ordinaire","Visible"],"answer":0}},{"title":"La boîte et ses petits objets","vocab":[["un objet","شيء غرض"],["un trésor","كنز"],["garder","يحتفظ"],["précieux","ثمين"],["souvenir","ذكرى"]],"source":"SEMAINE 4/6 · SÉANCE 3/5 · 45 À 60 MIN La boîte et ses petits objets\n\nObjets · sens personnel\n\nÀ la fin, je sais : expliquer pourquoi les objets ordinaires ont une valeur affective pour l’enfant.\n\n1. Je me rappelle\n\n1. Qui est Abdallah ?\n\n2. Que signifie « imaginer » ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nun objetشيء / غرضIl garde un objet.\n\nun trésorكنزC’est son trésor.\n\ngarderيحتفظJe garde une photo.\n\nprécieuxثمينCe souvenir est précieux.\n\nsouvenirذكرىL’objet me rappelle un souvenir.\n\n3. Je lis et je comprends\n\nDans sa boîte à merveilles, Sidi Mohammed garde de petits objets variés. Ils peuvent sembler sans valeur pour d’autres personnes. Pourtant, pour lui, ces objets sont précieux : ils nourrissent son imagination et l’aident à échapper à la solitude.\n\nSynthèse pédagogique de la description de la boîte au chapitre I.\n\n4. Questions de lecture\n\n1. Que garde Sidi Mohammed dans sa boîte ?\n\n2. Ces objets semblent-ils toujours précieux aux autres ?\n\n3. Pourquoi sont-ils importants pour l’enfant ?\n\n4. Recopie le mot qui signifie « de grande valeur pour lui ».\n\n5. Je travaille la langue\n\n« Pourtant » marque une opposition. « Pour lui » indique un point de vue personnel.\n\n1. Complète : Ces objets sont petits. ______, ils sont importants.\n\n2. Écris une phrase contenant « souvenir ».\n\n3. Donne une expression du texte qui indique un point de vue.\n\n6. J’écris\n\nDécris un petit objet personnel important pour toi en 4 ou 5 phrases.\n\nTravail personnel (10 à 15 min) : Choisir un petit objet et le décrire en deux phrases.","session":3,"assessment":false,"page":6,"sourceNote":"Contenu repris du cahier PDF de la semaine 4. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Que représente la boîte pour lui ?","options":["Un univers personnel","Un cartable","Un repas"],"answer":0}},{"title":"Comprendre une justification","vocab":[["une preuve","دليل"],["un indice","قرينة"],["montrer","يبين"],["car","ألن"],["exprimer","يعبر"]],"source":"SEMAINE 4/6 · SÉANCE 4/5 · 45 À 60 MIN Comprendre une justification\n\nQuestion type régional\n\nÀ la fin, je sais : répondre « idée + preuve tirée du texte » sans recopier tout le paragraphe.\n\n1. Je me rappelle\n\n1. Que garde le garçon dans sa boîte ?\n\n2. Quelle émotion la boîte aide-t-elle à apaiser ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nune preuveدليلJe donne une preuve.\n\nun indiceقرينةJe relève un indice.\n\nmontrerيبينLe texte montre sa tristesse.\n\ncarألنIl est triste car il est seul.\n\nexprimerيعبرIl exprime un sentiment.\n\n3. Je lis et je comprends\n\nLe soir, Sidi Mohammed se sent souvent seul. Il pense à ses souvenirs. Ses petits trésors font vivre son imagination. Grâce à eux, il peut rêver d’un monde différent.\n\nTexte pédagogique de consolidation, inspiré du thème de la solitude.\n\n4. Questions de lecture\n\n1. Quel sentiment ressent-il le soir ?\n\n2. Que font ses petits trésors ?\n\n3. Recopie trois mots qui évoquent l’imagination ou le souvenir.\n\n4. Question de type régional : pourquoi les objets l’aident-ils ? Justifie par un élément du texte.\n\n5. Je travaille la langue\n\nMéthode : 1. Je réponds. 2. Je recopie 2 à 6 mots de preuve. Exemple : « Il est seul, comme le montre “se sent souvent seul”. »\n\n1. Complète : Sidi Mohammed rêve ______ il se sent seul.\n\n2. Écris « Le texte montre ... » avec le mot « solitude ».\n\n3. Relève un verbe à l’infinitif dans le passage.\n\n6. J’écris\n\nRéponds en 4 phrases : comment le rêve peut-il aider une personne triste ?\n\nTravail personnel (10 à 15 min) : Préparer cinq mots du champ lexical des sentiments.","session":4,"assessment":false,"page":8,"sourceNote":"Contenu repris du cahier PDF de la semaine 4. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Une justification comporte…","options":["Une idée et une preuve","Une seule traduction","Un titre seulement"],"answer":0}},{"title":"Évaluation : solitude et imagination","vocab":[["la joie","الفرح"],["la tristesse","الحزن"],["rêver","يحلم"],["un souvenir","ذكرى"],["un ami","صديق"]],"source":"SEMAINE 4/6 · SÉANCE 5/5 · 45 À 60 MIN Évaluation : solitude et imagination\n\nÉvaluation /20\n\nÀ la fin, je sais : comprendre un texte et justifier deux réponses, puis écrire une petite opinion.\n\n1. Je me rappelle\n\n1. Cite un personnage de Dar Chouafa.\n\n2. Quelle est la fonction de la boîte pour Sidi Mohammed ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nla joieالفرحJe ressens de la joie.\n\nla tristesseالحزنIl ressent de la tristesse.\n\nrêverيحلمIl aime rêver.\n\nun souvenirذكرىC’est un beau souvenir.\n\nun amiصديقUn ami m’écoute.\n\n3. Je lis et je comprends\n\nUn garçon est souvent seul. Il aime rêver et garde des petits objets dans une boîte. Ces objets lui rappellent des souvenirs agréables. Quand il est triste, il ouvre la boîte et imagine de belles histoires.\n\nTexte original d’évaluation (ne pas attribuer ces phrases à l’auteur).\n\n4. Questions de lecture\n\n1. (2 pts) Comment se sent souvent le garçon ?\n\n2. (2 pts) Que garde-t-il dans une boîte ?\n\n3. (2 pts) Que lui rappellent les objets ?\n\n4. (2 pts) Que fait-il quand il est triste ?\n\n5. (2 pts) Recopie trois mots du texte qui évoquent le rêve ou le souvenir.\n\n5. Je travaille la langue\n\nBARÈME : compréhension /10 ; langue /4 ; expression écrite /6.\n\n1. (1 pt) Complète : Il est triste ______ il est seul.\n\n2. (1 pt) Transforme au négatif : « Il aime rêver. »\n\n3. (2 pts) Donne deux mots de la famille ou du champ lexical du rêve.\n\n6. J’écris\n\n(6 pts) En 5 ou 6 phrases, réponds : un objet peut-il rappeler un beau souvenir ? Donne ton avis et un exemple.\n\nTravail personnel (10 à 15 min) : Corriger les erreurs ; relire les textes de la semaine.","session":5,"assessment":true,"page":10,"sourceNote":"Contenu repris du cahier PDF de la semaine 4. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"« Parce que » introduit…","options":["Une cause","Un lieu","Une date"],"answer":0}}]},{"week":5,"title":"Événements et chronologie","sessions":[{"title":"Le bain maure et les sensations","vocab":[["le bain maure","الحمّام التقليدي"],["la chaleur","الحرارة"],["le bruit","الضجيج"],["avoir peur","يخاف"],["une sensation","إحساس"]],"source":"SEMAINE 5/6 · SÉANCE 1/5 · 45 À 60 MIN Le bain maure et les sensations\n\nLieu · sensations\n\nÀ la fin, je sais : repérer les sensations du narrateur et comprendre qu’un lieu peut provoquer une émotion.\n\n1. Je me rappelle\n\n1. Que représente la boîte à merveilles ?\n\n2. Quel personnage aime rêver ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nle bain maureالحمّام التقليديLa mère va au bain maure.\n\nla chaleurالحرارةLa chaleur est forte.\n\nle bruitالضجيجLe bruit fatigue l’enfant.\n\navoir peurيخافL’enfant a peur.\n\nune sensationإحساسLe bruit est une sensation auditive.\n\n3. Je lis et je comprends\n\nSidi Mohammed accompagne sa mère au bain maure. Il découvre un lieu animé, bruyant et très chaud. Cette expérience le trouble : il ne s’y sent pas à l’aise.\n\nReformulation pédagogique de l’épisode du bain maure, chapitre II.\n\n4. Questions de lecture\n\n1. Avec qui l’enfant va-t-il au bain ?\n\n2. Donne deux caractéristiques du lieu.\n\n3. L’enfant se sent-il à l’aise ?\n\n4. Recopie un mot qui évoque un bruit.\n\n5. Je travaille la langue\n\nPour décrire : « Le lieu est ... ». Pour expliquer : « L’enfant a peur parce que ... ».\n\n1. Complète : Le bain maure est très ______.\n\n2. Transforme : « Il est à l’aise. » à la forme négative.\n\n3. Écris une phrase avec « parce que ».\n\n6. J’écris\n\nRaconte en 4 phrases une visite dans un lieu très bruyant.\n\nTravail personnel (10 à 15 min) : Revoir les mots de sensations : chaud, bruyant, peur.","session":1,"assessment":false,"page":2,"sourceNote":"Contenu repris du cahier PDF de la semaine 5. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Quel lieu est bruyant et chaud ?","options":["Le bain maure","Le jardin","Le Msid"],"answer":0}},{"title":"Une visite chez Lalla Aïcha","vocab":[["une amie","صديقة"],["une visite","زيارة"],["un conseil","نصيحة"],["discuter","يتحدث"],["écouter","يستمع"]],"source":"SEMAINE 5/6 · SÉANCE 2/5 · 45 À 60 MIN Une visite chez Lalla Aïcha\n\nPersonnages · actions\n\nÀ la fin, je sais : identifier Lalla Aïcha et reformuler une visite entre adultes.\n\n1. Je me rappelle\n\n1. Avec qui Sidi Mohammed va-t-il au bain ?\n\n2. Cite deux sensations de l’enfant.\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nune amieصديقةLalla Aïcha est une amie.\n\nune visiteزيارةElle rend une visite.\n\nun conseilنصيحةElle donne un conseil.\n\ndiscuterيتحدثLes femmes discutent.\n\nécouterيستمعL’enfant écoute.\n\n3. Je lis et je comprends\n\nLalla Aïcha, une ancienne voisine de Lalla Zoubida, lui rend visite. Les deux femmes discutent. Lalla Aïcha écoute les problèmes de son amie et lui donne des conseils.\n\nReformulation pédagogique de l’épisode avec Lalla Aïcha, chapitre II.\n\n4. Questions de lecture\n\n1. Qui rend visite à Lalla Zoubida ?\n\n2. Quel lien existait entre les deux femmes ?\n\n3. Que fait Lalla Aïcha ?\n\n4. Donne un verbe qui signifie « parler ensemble ».\n\n5. Je travaille la langue\n\nLes pronoms : « elle » = une femme ; « lui » = à cette personne. Observer le référent dans chaque phrase.\n\n1. Complète : Lalla Aïcha ______ visite. (rend / rendent)\n\n2. Remplace le nom : « Lalla Aïcha discute. » → « ______ discute. »\n\n3. Écris : « Elle donne ... » avec le mot « conseil ».\n\n6. J’écris\n\nÉcris 4 phrases pour présenter une visite entre deux amies.\n\nTravail personnel (10 à 15 min) : Apprendre les cinq mots puis faire deux phrases sur l’amitié.","session":2,"assessment":false,"page":4,"sourceNote":"Contenu repris du cahier PDF de la semaine 5. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Qui est Lalla Aïcha ?","options":["Une amie de Lalla Zoubida","La fille de Rahma","La voyante"],"answer":0}},{"title":"La disparition de Zineb","vocab":[["disparaître","يختفي"],["chercher","يبحث"],["inquiet","قلق"],["pleurer","يبكي"],["retrouver","يجد مجددا"]],"source":"SEMAINE 5/6 · SÉANCE 3/5 · 45 À 60 MIN La disparition de Zineb\n\nÉvénement · cause\n\nÀ la fin, je sais : comprendre la disparition temporaire de Zineb et les réactions des habitants.\n\n1. Je me rappelle\n\n1. Qui est Lalla Aïcha ?\n\n2. Quelle femme est la mère de Zineb ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\ndisparaîtreيختفيLa petite fille disparaît.\n\nchercherيبحثSa mère la cherche.\n\ninquietقلقRahma est inquiète.\n\npleurerيبكيElle pleure.\n\nretrouverيجد مجدداOn retrouve la fille.\n\n3. Je lis et je comprends\n\nUn jour, Rahma perd la trace de sa fille Zineb dans la foule. Elle rentre bouleversée. Les habitantes de Dar Chouafa l’aident à chercher l’enfant. Plus tard, Zineb est retrouvée.\n\nReformulation pédagogique de l’épisode du chapitre IV.\n\n4. Questions de lecture\n\n1. Qui disparaît ?\n\n2. Dans quelle situation Zineb se perd-elle ?\n\n3. Comment se sent Rahma ?\n\n4. Qui aide à chercher l’enfant ?\n\n5. L’histoire se termine-t-elle par la découverte de Zineb ?\n\n5. Je travaille la langue\n\nChronologie : « D’abord ... Ensuite ... Enfin ... ».\n\n1. Complète : ______, Zineb disparaît.\n\n2. Complète : ______, les femmes la cherchent.\n\n3. Complète : ______, la fille est retrouvée.\n\n6. J’écris\n\nRaconte la disparition de Zineb en 5 phrases avec trois connecteurs.\n\nTravail personnel (10 à 15 min) : Dire oralement l’événement avec d’abord, ensuite, enfin.","session":3,"assessment":false,"page":6,"sourceNote":"Contenu repris du cahier PDF de la semaine 5. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Qui disparaît temporairement ?","options":["Zineb","Sidi Mohammed","Driss El Aouad"],"answer":0}},{"title":"Le soulagement et le repas","vocab":[["soulagé","مرتاح"],["remercier","يشكر"],["un repas","وجبة مأدبة"],["inviter","يدعو"],["la joie","الفرح"]],"source":"SEMAINE 5/6 · SÉANCE 4/5 · 45 À 60 MIN Le soulagement et le repas\n\nConséquence · émotion\n\nÀ la fin, je sais : expliquer l’émotion de Rahma après les retrouvailles et enchaîner plusieurs événements.\n\n1. Je me rappelle\n\n1. Qui a disparu ?\n\n2. Comment se termine l’épisode ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nsoulagéمرتاحRahma est soulagée.\n\nremercierيشكرElle remercie Dieu.\n\nun repasوجبة / مأدبةElle prépare un repas.\n\ninviterيدعوElle invite les voisines.\n\nla joieالفرحLa famille ressent de la joie.\n\n3. Je lis et je comprends\n\nAprès avoir retrouvé sa fille Zineb, Rahma est très heureuse. Pour remercier Dieu, elle organise un repas. Les femmes de la maison participent aux préparatifs. L’ambiance devient joyeuse.\n\nReformulation pédagogique de la suite de l’épisode, chapitre IV.\n\n4. Questions de lecture\n\n1. Pourquoi Rahma est-elle heureuse ?\n\n2. Que prépare-t-elle ?\n\n3. Qui participe aux préparatifs ?\n\n4. Quel sentiment domine dans ce passage ?\n\n5. Je travaille la langue\n\nCause : « parce que ». Conséquence : « donc » et « c’est pourquoi ».\n\n1. Complète : Rahma est heureuse ______ sa fille est retrouvée.\n\n2. Complète : Zineb est retrouvée, ______ Rahma organise un repas.\n\n3. Forme une phrase avec « soulagée ».\n\n6. J’écris\n\nEn 5 phrases, résume les deux étapes : disparition puis retrouvailles de Zineb.\n\nTravail personnel (10 à 15 min) : Revoir les connecteurs chronologiques et de cause.","session":4,"assessment":false,"page":8,"sourceNote":"Contenu repris du cahier PDF de la semaine 5. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Que signifie « soulagé » ?","options":["Rassuré après une inquiétude","Fâché","En retard"],"answer":0}},{"title":"Évaluation : raconter un événement","vocab":[["perdre","يفقد"],["chercher","يبحث"],["retrouver","يستعيد يجد"],["ensuite","ثم"],["enfin","أخيرا"]],"source":"SEMAINE 5/6 · SÉANCE 5/5 · 45 À 60 MIN Évaluation : raconter un événement\n\nÉvaluation /20\n\nÀ la fin, je sais : identifier un événement et écrire un court récit chronologique.\n\n1. Je me rappelle\n\n1. Que signifie « soulagé » ?\n\n2. Donne un connecteur qui commence un récit.\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nperdreيفقدElle perd sa fille.\n\nchercherيبحثElle la cherche.\n\nretrouverيستعيد / يجدElle la retrouve.\n\nensuiteثمEnsuite, elle rentre.\n\nenfinأخيراEnfin, tout va bien.\n\n3. Je lis et je comprends\n\nRahma sort avec Zineb. Dans la foule, elle perd sa fille. Elle rentre en pleurant. Des femmes viennent l’aider. Après de longues recherches, Zineb est retrouvée. Sa mère retrouve le sourire.\n\nTexte de synthèse original pour l’évaluation.\n\n4. Questions de lecture\n\n1. (2 pts) Avec qui Rahma sort-elle ?\n\n2. (2 pts) Où perd-elle sa fille ?\n\n3. (2 pts) Comment rentre-t-elle ?\n\n4. (2 pts) Qui vient l’aider ?\n\n5. (2 pts) Comment se termine l’histoire ?\n\n5. Je travaille la langue\n\nBARÈME : compréhension /10 ; langue /4 ; expression /6.\n\n1. (1 pt) Complète : ______, Rahma sort avec Zineb.\n\n2. (1 pt) Complète : ______, elle cherche sa fille.\n\n3. (2 pts) Mets à la forme négative : « Zineb est retrouvée. »\n\n6. J’écris\n\n(6 pts) Raconte en 5 ou 6 phrases un moment de peur suivi d’un soulagement. Utilise « d’abord », « ensuite », « enfin ».\n\nTravail personnel (10 à 15 min) : Relire la semaine ; préparer l’évaluation finale.","session":5,"assessment":true,"page":10,"sourceNote":"Contenu repris du cahier PDF de la semaine 5. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Quel mot indique une suite d’événements ?","options":["Ensuite","Parce que","Mais"],"answer":0}}]},{"week":6,"title":"Vers l’examen régional","sessions":[{"title":"Situer et comprendre un extrait","vocab":[["un extrait","مقتطف"],["le titre","العنوان"],["l’auteur","المؤلف"],["situer","يحدد السياق"],["une question","سؤال"]],"source":"SEMAINE 6/6 · SÉANCE 1/5 · 45 À 60 MIN Situer et comprendre un extrait\n\nMéthode régionale\n\nÀ la fin, je sais : présenter un extrait : titre, auteur, personnage, lieu et moment.\n\n1. Je me rappelle\n\n1. Qui est l’auteur du roman ?\n\n2. Quel personnage est le narrateur enfant ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nun extraitمقتطفJe lis un extrait.\n\nle titreالعنوانJe donne le titre.\n\nl’auteurالمؤلفJe connais l’auteur.\n\nsituerيحدد السياقJe situe un passage.\n\nune questionسؤالJe réponds à une question.\n\n3. Je lis et je comprends\n\nSidi Mohammed est un enfant de Fès. Il vit avec sa famille à Dar Chouafa. Il observe les habitants de la maison. Dans ses souvenirs, il parle souvent de sa solitude et de ses rêves.\n\nTexte pédagogique de révision (pas une citation).\n\n4. Questions de lecture\n\n1. Quel est le nom du personnage principal ?\n\n2. Où habite-t-il ?\n\n3. Cite deux thèmes de ce texte.\n\n4. Quel est le titre du roman étudié ?\n\n5. Qui a écrit ce roman ?\n\n5. Je travaille la langue\n\nFiche d’identité : œuvre = La Boîte à merveilles ; auteur = Ahmed Sefrioui ; genre = roman à caractère autobiographique ; narrateur = voix qui raconte ses souvenirs.\n\n1. Complète : L’auteur du roman est ______.\n\n2. Complète : Le personnage principal s’appelle ______.\n\n3. Écris une phrase avec « l’extrait présente ».\n\n6. J’écris\n\nPrésente l’œuvre en 4 à 5 phrases faciles.\n\nTravail personnel (10 à 15 min) : Apprendre la fiche d’identité de l’œuvre et la dire oralement.","session":1,"assessment":false,"page":2,"sourceNote":"Contenu repris du cahier PDF de la semaine 6. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Qui est l’auteur de La Boîte à merveilles ?","options":["Ahmed Sefrioui","Jean Anouilh","Victor Hugo"],"answer":0}},{"title":"Répondre avec une preuve","vocab":[["relever","استخراج"],["justifier","تبرير"],["un indice","دليل"],["d’après","حسب"],["car","ألن"]],"source":"SEMAINE 6/6 · SÉANCE 2/5 · 45 À 60 MIN Répondre avec une preuve\n\nJustification · indices\n\nÀ la fin, je sais : utiliser « car » et une expression courte du passage pour prouver sa réponse.\n\n1. Je me rappelle\n\n1. Qui est l’auteur de La Boîte à merveilles ?\n\n2. Quel sentiment revient souvent dans le roman ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nreleverاستخراجJe relève une expression.\n\njustifierتبريرJe justifie ma réponse.\n\nun indiceدليلJe trouve un indice.\n\nd’aprèsحسبD’après le texte, il est triste.\n\ncarألنIl a peur car il est seul.\n\n3. Je lis et je comprends\n\nSidi Mohammed reste parfois seul. Il n’aime pas toujours les jeux des autres enfants. Alors, il préfère rêver et regarder les objets de sa boîte. Cet univers personnel l’aide à se sentir mieux.\n\nTexte de pratique de la justification, inspiré de thèmes du roman.\n\n4. Questions de lecture\n\n1. Le garçon joue-t-il toujours avec les autres ?\n\n2. Que préfère-t-il faire ?\n\n3. Recopie les mots qui indiquent la solitude.\n\n4. Pourquoi regarde-t-il les objets de sa boîte ? Justifie en citant une expression.\n\n5. Je travaille la langue\n\nRéponse en deux parties : « Il préfère rêver, car le texte dit : “il préfère rêver”. » Ne recopier qu’une courte expression.\n\n1. Complète : ______ le texte, l’enfant aime rêver.\n\n2. Complète : Il ouvre sa boîte ______ il cherche du réconfort.\n\n3. Transforme en réponse justifiée : « Il est seul. »\n\n6. J’écris\n\nRéponds en 4 phrases : pourquoi les souvenirs peuvent-ils aider une personne ?\n\nTravail personnel (10 à 15 min) : Créer deux questions « pourquoi ? » et écrire une justification.","session":2,"assessment":false,"page":4,"sourceNote":"Contenu repris du cahier PDF de la semaine 6. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Une preuve dans un texte est…","options":["Un indice pertinent","Une opinion inventée","Une copie complète"],"answer":0}},{"title":"Préparer un paragraphe argumentatif","vocab":[["à mon avis","في رأيي"],["d’abord","أوال"],["donc","لذلك"],["un argument","حجة"]],"source":"SEMAINE 6/6 · SÉANCE 3/5 · 45 À 60 MIN Préparer un paragraphe argumentatif\n\nOpinion · argument\n\nÀ la fin, je sais : rédiger 5 à 7 phrases avec avis, argument, exemple et conclusion.\n\n1. Je me rappelle\n\n1. Que veut dire « justifier » ?\n\n2. Donne un connecteur de cause.\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nà mon avisفي رأييÀ mon avis, l’amitié est utile.\n\nd’abordأوالD’abord, les amis aident.\n\npar exempleمثالPar exemple, ils écoutent.\n\ndoncلذلكDonc, l’amitié est importante.\n\nun argumentحجةJe donne un argument.\n\n3. Je lis et je comprends\n\nSujet d’entraînement : « Un enfant a-t-il besoin d’amis ? » Le roman montre un garçon qui se sent souvent seul. Cela permet de réfléchir à la place de l’amitié dans la vie.\n\nConsigne pédagogique en lien avec le thème du roman.\n\n4. Questions de lecture\n\n1. Quel est le sujet de réflexion ?\n\n2. Quel sentiment de Sidi Mohammed aide à réfléchir au sujet ?\n\n3. Le sujet demande-t-il de raconter tout le roman ?\n\n4. Quel type de réponse faut-il donner : une opinion ou une liste de personnages ?\n\n5. Je travaille la langue\n\nPlan court : 1) À mon avis... 2) D’abord... 3) Par exemple... 4) Ensuite... 5) Donc...\n\n1. Complète : ______, les amis nous aident.\n\n2. Complète : ______, un ami peut écouter une personne triste.\n\n3. Complète : ______, l’amitié est importante.\n\n6. J’écris\n\nSujet : « Les amis sont-ils importants dans la vie ? » Rédige 5 à 7 phrases avec au moins un argument et un exemple.\n\nTravail personnel (10 à 15 min) : Apprendre les quatre connecteurs : à mon avis, d’abord, par exemple, donc.","session":3,"assessment":false,"page":6,"sourceNote":"Contenu repris du cahier PDF de la semaine 6. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Comment commencer une opinion ?","options":["À mon avis…","Il était une fois…","Où ?"],"answer":0}},{"title":"Entraînement au sujet complet","vocab":[["comprendre","يفهم"],["répondre","يجيب"],["corriger","يصحح"],["relire","يعيد القراءة"],["organiser","ينظم"]],"source":"SEMAINE 6/6 · SÉANCE 4/5 · 45 À 60 MIN Entraînement au sujet complet\n\nLecture · langue · écriture\n\nÀ la fin, je sais : enchaîner compréhension, grammaire et expression dans un temps limité.\n\n1. Je me rappelle\n\n1. Quels sont les quatre éléments du paragraphe argumentatif ?\n\n2. Qu’est-ce qu’un indice du texte ?\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\ncomprendreيفهمJe comprends la question.\n\nrépondreيجيبJe réponds clairement.\n\ncorrigerيصححJe corrige mes erreurs.\n\nrelireيعيد القراءةJe relis mon travail.\n\norganiserينظمJ’organise mes idées.\n\n3. Je lis et je comprends\n\nAprès une journée difficile, Sidi Mohammed regarde sa boîte à merveilles. Les petits objets réveillent ses souvenirs et son imagination. Il se sent moins seul lorsqu’il rêve à de belles histoires.\n\nTexte pédagogique de préparation (non extrait de l’œuvre).\n\n4. Questions de lecture\n\n1. Qui est le personnage ?\n\n2. Que regarde-t-il après une journée difficile ?\n\n3. Quel effet ont les objets sur lui ?\n\n4. Releve une expression qui montre la solitude.\n\n5. Je travaille la langue\n\nGestion du temps : lire le texte deux fois ; souligner les mots importants ; répondre ; relire les phrases avant de rendre le devoir.\n\n1. Recopie un verbe au présent du texte.\n\n2. Complète : Il rêve ______ les objets lui rappellent des souvenirs.\n\n3. Transforme : « Il se sent seul. » à la forme négative.\n\n6. J’écris\n\nSujet : « Les souvenirs sont-ils utiles ? » Écris un paragraphe de 5 à 7 phrases avec avis, argument, exemple, conclusion.\n\nTravail personnel (10 à 15 min) : Réviser la semaine 6 et les principaux personnages du roman.","session":4,"assessment":false,"page":8,"sourceNote":"Contenu repris du cahier PDF de la semaine 6. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"L’étude de texte demande…","options":["Comprendre et justifier","Dessiner uniquement","Traduire tout le roman"],"answer":0}},{"title":"Bilan final des six semaines","vocab":[["un personnage","شخصية"],["une émotion","عاطفة"],["un indice","دليل"],["un argument","حجة"],["une conclusion","خالصة"]],"source":"SEMAINE 6/6 · SÉANCE 5/5 · 45 À 60 MIN Bilan final des six semaines\n\nÉvaluation finale /20\n\nÀ la fin, je sais : mesurer les acquis sur un texte et rédiger un paragraphe argumentatif simple.\n\n1. Je me rappelle\n\n1. Quel est le titre du roman étudié ?\n\n2. Donne le nom du personnage principal.\n\n2. Je découvre les mots\n\nMot / expressionالمعنى بالعربيةExemple\n\nun personnageشخصيةSidi Mohammed est un personnage.\n\nune émotionعاطفةLa tristesse est une émotion.\n\nun indiceدليلJe relève un indice.\n\nun argumentحجةJe donne un argument.\n\nune conclusionخالصةJe termine par une conclusion.\n\n3. Je lis et je comprends\n\nSidi Mohammed habite à Fès avec ses parents. À Dar Chouafa, il connaît plusieurs voisines, dont Rahma et Fatma Bziouya. L’enfant aime parfois rester seul et rêver. Sa boîte renferme de petits objets qui nourrissent son imagination et lui rappellent des souvenirs.\n\nTexte original pour l’évaluation finale : synthèse pédagogique, non un extrait authentique.\n\n4. Questions de lecture\n\n1. (2 pts) Dans quelle ville vit Sidi Mohammed ?\n\n2. (2 pts) Avec qui habite-t-il ?\n\n3. (2 pts) Cite deux voisines de la famille.\n\n4. (2 pts) Que contient sa boîte ?\n\n5. (2 pts) Pourquoi cette boîte est-elle importante ? Justifie par des mots du texte.\n\n5. Je travaille la langue\n\nBARÈME : compréhension /10 ; langue /4 ; expression /6. Temps conseillé : 45 min puis 15 min de correction.\n\n1. (1 pt) Recopie un verbe au présent du texte.\n\n2. (1 pt) Écris une phrase avec « parce que ».\n\n3. (2 pts) Mets à la forme négative : « L’enfant aime rêver. »\n\n6. J’écris\n\n(6 pts) Sujet : « Est-il important de garder les souvenirs de son enfance ? » Réponds en 6 à 8 phrases avec opinion, argument, exemple et conclusion.\n\nTravail personnel (10 à 15 min) : Faire un bilan : 3 points acquis, 2 points à renforcer et 1 objectif personnel pour le mois suivant.","session":5,"assessment":true,"page":10,"sourceNote":"Contenu repris du cahier PDF de la semaine 6. Les textes pédagogiques restent distingués des extraits authentiques.","quiz":{"q":"Quel élément appartient à une argumentation ?","options":["Un exemple","Une signature","Une adresse postale"],"answer":0}}]}];const K='merveilles-cours-1-6-v1';let saved;try{saved=JSON.parse(localStorage.getItem(K))||{}}catch(e){saved={}}saved.done??={};saved.writing??={};saved.scores??={};let week=-1,session=-1,flipped={},picked=null,matched=[],chosen=-1;const $=id=>document.getElementById(id);function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function store(){localStorage.setItem(K,JSON.stringify(saved))}function key(){return `${week+1}-${session+1}`}function go(w=-1,s=-1){week=w;session=s;flipped={};picked=null;matched=[];chosen=-1;render();scrollTo(0,0)}function render(){if(week<0){home();return}if(session<0){weeks();return}lesson()}function overall(){return Object.keys(saved.done).filter(k=>saved.done[k]).length}function home(){let n=overall();$('app').innerHTML=`<div class="card"><h2>Mon parcours de français</h2><p>30 séances réparties sur 6 semaines, adaptées à une première lecture de <em>La Boîte à merveilles</em>.</p><p class="small">Chaque séance reprend les consignes du cahier PDF, et propose des cartes de vocabulaire, des associations, un quiz complémentaire et une petite rédaction.</p><div class="flex space"><span><b>${n}/30</b> séances terminées</span><span class="tag">45–60 min / séance</span></div><div class="progress"><div class="bar" style="width:${n/30*100}%"></div></div></div><div class="grid">${course.map((w,i)=>{let count=w.sessions.filter((s,j)=>saved.done[`${i+1}-${j+1}`]).length;return `<button class="card week" onclick="go(${i})"><span class="chip">SEMAINE ${w.week} · ${count}/5 séances</span><strong>${safe(w.title)}</strong><span class="small">Lire · Comprendre · S'exercer</span><div class="progress"><div class="bar" style="width:${count*20}%"></div></div></button>`}).join('')}</div><div class="card"><h3>Chapitre II — Semaine 8</h3><p>Tu peux continuer à utiliser les cinq séances interactives déjà installées.</p><a class="btn" style="display:inline-block;text-decoration:none" href="semaine8.html">Ouvrir la semaine 8 →</a></div><p class="foot">Les progrès sont enregistrés uniquement sur ce téléphone. Les textes simplifiés ne sont pas des citations du roman. Aucun compte nécessaire.</p>`}function weeks(){const w=course[week];$('app').innerHTML=`<div class="card"><div class="flex"><button class="btn alt" onclick="go()">← Accueil</button><span class="tag">SEMAINE ${w.week}</span></div><h2>${safe(w.title)}</h2><p>Une séance par jour, avec la fiche originale et des exercices interactifs complémentaires.</p></div>${w.sessions.map((s,i)=>`<button class="card week" style="width:100%" onclick="go(${week},${i})"><span class="chip">SÉANCE ${i+1} · ${saved.done[`${week+1}-${i+1}`]?'✓ terminée':'45–60 min'}</span><strong>${safe(s.title)}</strong><span class="small">${s.vocab.length} cartes de vocabulaire · 1 jeu · 1 quiz</span></button>`).join('')}`}function lesson(){let l=course[week].sessions[session],k=key();$('app').innerHTML=`<div class="card"><div class="flex space"><button class="btn alt" onclick="go(${week})">← Semaine ${week+1}</button><span class="tag">SÉANCE ${session+1}/5</span></div><h2>${safe(l.title)}</h2><p class="small">45–60 minutes · ${l.assessment?'Évaluation et révisions':'Lecture, vocabulaire et entraînement'}</p></div><div class="card"><h3>📖 1. Fiche de lecture et exercices du PDF</h3><p class="small">Retrouve ici le texte et les consignes du cahier original. Essaie les questions avant de passer aux jeux.</p><button class="btn alt" id="toggle" onclick="let e=$('src');e.hidden=!e.hidden;this.textContent=e.hidden?'Voir la fiche originale':'Masquer la fiche'">Voir la fiche originale</button><div class="original" id="src" hidden>${safe(l.source)}</div><p class="small">${safe(l.sourceNote)}</p></div><div class="card"><h3>🃏 2. Cartes français-arabe</h3><p class="small">Touche les cartes pour voir la traduction.</p><div class="wordgrid" id="cards"></div></div><div class="card"><h3>🔗 3. Associer les mots</h3><p class="small">Touche un mot français, puis sa traduction en arabe.</p><div class="pair-grid" id="pairbox"></div><div id="pairresult" aria-live="polite"></div><button class="btn alt" onclick="matched=[];picked=null;renderPairs()">Recommencer</button></div><div class="card"><h3>✅ 4. Compréhension — petit quiz</h3><p class="small">Question complémentaire créée pour réviser le thème de cette séance.</p><div id="quiz"></div></div><div class="card"><h3>✍️ 5. J'écris en français</h3><p>En 2 à 5 phrases, explique ce que tu as retenu de cette séance. Pour l'évaluation finale, écris plutôt un paragraphe complet.</p><textarea id="writing" placeholder="J'ai compris que…" oninput="saved.writing[key()]=this.value;store()">${safe(saved.writing[k]||'')}</textarea><p class="small">Cette réponse libre est à faire relire par ton enseignant ; l'application ne lui attribue pas automatiquement une note.</p></div><div class="card"><button class="btn" onclick="saved.done[key()]=true;store();document.getElementById('status').textContent='✓ Séance enregistrée !';">Marquer comme terminée ✓</button><p id="status" aria-live="polite"></p><div class="flex"><button class="btn alt" ${session===0?'disabled':''} onclick="go(${week},${session-1})">← Précédente</button><button class="btn alt" ${session===4?'disabled':''} onclick="go(${week},${session+1})">Suivante →</button></div></div>`;renderCards();renderPairs();renderQuiz()}function renderCards(){let a=course[week].sessions[session].vocab;$('cards').innerHTML=a.length?a.map((p,i)=>`<button class="flash" onclick="flipped[${i}]=!flipped[${i}];renderCards()">${flipped[i]?`<strong class="tr arabic">${safe(p[1])}</strong><small>Appuie pour revoir le mot</small>`:`<strong>${safe(p[0])}</strong><small>Toucher pour traduire ↻</small>`}</button>`).join(''):'<p>Révise le vocabulaire des séances précédentes.</p>'}function renderPairs(){let a=course[week].sessions[session].vocab.slice(0,5);if(!a.length){$('pairbox').innerHTML='<p>Pas de mots nouveaux : révise les cartes précédentes.</p>';return}let perm=[2,0,4,1,3].filter(i=>i<a.length),order=[...perm,...a.map((x,i)=>i).filter(i=>!perm.includes(i))];$('pairbox').innerHTML=`<div>${a.map((p,i)=>`<button class="pair ${matched.includes(i)?'solved':''} ${picked===i?'chosen':''}" ${matched.includes(i)?'disabled':''} onclick="picked=${i};renderPairs()">${safe(p[0])}</button>`).join('')}</div><div>${order.map(i=>`<button class="pair arabic ${matched.includes(i)?'solved':''}" ${matched.includes(i)?'disabled':''} onclick="match(${i})">${safe(a[i][1])}</button>`).join('')}</div>`;$('pairresult').innerHTML=`<p class="small">${matched.length}/${a.length} associations correctes.</p>`}function match(i){if(picked===null){$('pairresult').textContent='Choisis d’abord un mot français.';return}if(picked===i){matched.push(i);picked=null;renderPairs();if(matched.length===Math.min(5,course[week].sessions[session].vocab.length))$('pairresult').innerHTML='<p class="result success">Bravo, toutes les associations sont correctes !</p>'}else $('pairresult').innerHTML='<p class="result error">Ce n’est pas la bonne traduction : réessaie.</p>'}function renderQuiz(){let q=course[week].sessions[session].quiz;$('quiz').innerHTML=`<strong>${safe(q.q)}</strong>${q.options.map((x,i)=>`<button class="option ${chosen===i?'selected':''}" onclick="chosen=${i};renderQuiz()">${safe(x)}</button>`).join('')}<button class="btn" style="margin-top:12px" onclick="checkQuiz()">Vérifier</button><div id="quizres"></div>`}function checkQuiz(){let q=course[week].sessions[session].quiz;let ok=chosen===q.answer;$('quizres').innerHTML=`<div class="result ${ok?'success':'error'}">${ok?'Bravo !':'À revoir.'} Réponse : <b>${safe(q.options[q.answer])}</b>.</div>`;if(chosen>=0){saved.scores[key()]=ok?1:0;store()}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});</script></body></html>

8rem;color:#235875;margin:2px 4px 2px 0}.lesson-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:10px}.lesson-tile{text-align:left;background:white;border:1px solid var(--line);border-radius:13px;padding:14px;min-height:110px;color:var(--ink)}.lesson-tile:hover{border-color:var(--blue)}.lesson-tile strong{display:block;margin:7px 0 3px}.lesson-tile .done{color:#187653;font-weight:700}.btn{border:none;border-radius:12px;background:var(--blue);color:white;padding:10px 16px;font-weight:650}.btn.secondary{background:#e8f2f8;color:#1d5b7c}.btn.ghost{background:white;color:var(--blue);border:1px solid var(--line)}.btn:disabled{opacity:.52;cursor:default}.btn-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.q{border-top:1px solid #e5ecee;padding:15px 0}.q:first-child{border-top:0;padding-top:0}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.choice{background:white;border:1px solid #cbdde5;color:#23465b;border-radius:9px;padding:9px 12px;text-align:left}.choice.selected{background:#dceef8;border-color:var(--blue);font-weight:700}.choice.good{background:var(--ok);border-color:#219565}.choice.bad{background:var(--err);border-color:#dc6d61}.result{border-radius:9px;margin-top:10px;padding:11px;background:#eaf2f7}.result.ok{background:var(--ok)}.result.bad{background:var(--err)}.arabic{font-size:1.18rem;direction:rtl;font-family:Tahoma,Arial,sans-serif}.wordlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.word{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:112px;padding:12px;text-align:center;color:var(--ink)}.word strong{display:block;font-size:1rem;margin-bottom:9px}.word.flipped{background:#eaf6f4;border-color:#78bdb7}.hint{font-size:.78rem;color:var(--muted)}.matching{display:grid;grid-template-columns:1fr 1fr;gap:8px}.matching .choice{width:100%;min-height:48px}.matching .choice.linked{background:#e4f4ef}.chip{background:#f0f5f8;border:1px solid #d9e3e8;border- </style></head><body><div class="shell"><header class="top"><div class="eyebrow">Français • 1ère Bac • lecture guidée</div><h1>La Boîte à merveilles</h1><p>Chapitre II — Semaine 8 • cinq séances interactives</p><div class="progress"><div id="progressbar"></div></div><div class="stats"><span id="progresslabel">Progression : 0/5 séances</span><span>FR ↔ العربية</span></div></header><nav class="tabs" id="nav" aria-label="Navigation des séances"></nav><main id="main"></main><footer class="footer">Application pédagogique personnelle • Progrès enregistrés sur cet appareil • Les passages à lire sont dans l'exemplaire du roman.</footer></div><script>

{title:'Le mardi au Msid',sub:'Peur, cauchemars et école coranique',time:'55 min',read:'Lis le début du chapitre II, depuis « Le MARDI, jour néfaste… » jusqu’au passage où Lalla Aïcha vient rendre visite à Lalla Zoubida.',moment:'Le narrateur décrit un mardi qu’il redoute. Il a fait des cauchemars et il craint le fqih, ses exigences et les punitions.',words:[['néfaste','مشؤوم','Qui apporte du malheur'],['amertume','مرارة','Sentiment pénible'],['cauchemar','كابوس','Mauvais rêve'],['injures','شتائم','Paroles insultantes'],['ânonner','يتهجّى بصعوبة','Réciter avec difficulté'],['fragilité','هشاشة','État de faiblesse'],['appréhender','يخشى','Redouter quelque chose'],['planchette','لوح صغير','Planche pour les versets'],['fqih','الفقيه','Maître du Msid'],['migraine','صداع نصفي','Mal de tête intense']],questions:[['Quel jour l’enfant redoute-t-il ?',['Le mardi','Le dimanche','Le vendredi'],0,'Le chapitre commence par le mardi, présenté comme un jour néfaste.'],['Où se rend-il le matin ?',['Au marché','Au Msid','Au bain maure'],1,'Il va au Msid, l’école coranique.'],['Pourquoi a-t-il peur ?',['Il risque une punition du fqih','Il a perdu son jouet','Il ne trouve plus sa maison'],0,'La sévérité du maître provoque sa peur.'],['Que signifie « cauchemar » ?',['Un jeu','Un mauvais rêve','Une prière'],1,'C’est un mauvais rêve.']],order:['L’enfant passe une nuit difficile.','Le matin, il se rend au Msid.','Il redoute le regard et les punitions du fqih.','Il rentre déjeuner, puis Lalla Aïcha vient en visite.'],writing:'Écris deux phrases : « Sidi Mohammed a peur parce que… » et « Le mardi est difficile pour lui car… ».'},
{title:'Lalla Aïcha et la visite',sub:'Conseil, croyances et trajet',time:'55 min',read:'Poursuis la lecture à partir du conseil de Lalla Aïcha de se rendre à Sidi Ali Boughaleb, jusqu’à l’arrivée au sanctuaire.',moment:'Lalla Aïcha propose une visite au sanctuaire pour aider l’enfant. Les deux femmes se préparent et traversent des rues animées.',words:[['sanctuaire','مزار / مقام','Lieu sacré'],['guérison','شفاء','Retour à la santé'],['hésiter','يتردد','Ne pas se décider'],['haïk','حايك','Grand voile traditionnel'],['djellaba','جلابة','Vêtement long'],['cohue','ازدحام','Foule désordonnée'],['prudence','حذر','Attention au danger'],['chuchoter','يهمس','Parler très bas'],['se garer','يتجنب','Éviter un obstacle'],['soulager','يخفف','Diminuer une douleur']],questions:[['Qui propose la visite au sanctuaire ?',['Rahma','Lalla Aïcha','Zineb'],1,'C’est Lalla Aïcha qui donne ce conseil.'],['Pourquoi cette visite est-elle proposée ?',['Pour aider l’enfant à se sentir mieux','Pour acheter une maison','Pour chercher le père'],0,'Lalla Aïcha espère une amélioration de son état.'],['Comment les femmes avancent-elles dans la rue ?',['En traversant la foule','En bateau','Dans un train'],0,'Le texte raconte leur déplacement parmi les passants.'],['Quel vêtement traditionnel porte la mère ?',['Le haïk','Un costume','Une blouse blanche'],0,'Elle se drape dans son haïk.']],order:['Lalla Aïcha conseille une visite.','Lalla Zoubida accepte et se prépare.','Les trois personnages traversent les rues.','Ils arrivent près du sanctuaire.'],writing:'Explique en trois phrases pourquoi Lalla Aïcha propose la visite et comment elle se déroule.'},
{title:'Au sanctuaire',sub:'Le rituel et l’incident du chat',time:'55 min',read:'Lis la scène à Sidi Ali Boughaleb, avec le rituel autour de l’eau et les prières, jusqu’au moment où un chat griffe l’enfant et où sa mère le ramène à la maison.',moment:'La mère accomplit un rituel et les femmes prient. L’enfant s’approche d’un chat, qui le griffe. Il pleure, puis rentre avec sa mère.',words:[['mausolée','ضريح','Tombeau monumental'],['rituel','طقس','Gestes accomplis selon une coutume'],['invocation','دعاء','Parole de prière'],['gardienne','حارسة','Femme qui garde le lieu'],['caresser','يداعب','Toucher doucement'],['matou','قط ذكر','Chat mâle'],['griffe','مخلب','Ongle pointu du chat'],['blessure','جرح','Lésion du corps'],['sangloter','ينتحب','Pleurer avec des sanglots'],['vertige','دوار','Sensation de tournis']],questions:[['Que fait la mère avec l’eau ?',['Un rituel','La vaisselle','Un dessin'],0,'Elle donne de l’eau à boire à l’enfant et en utilise pendant le rituel.'],['Quel animal attire l’enfant ?',['Un chien','Un chat','Un cheval'],1,'Il s’approche d’un gros matou.'],['Que se passe-t-il ?',['Le chat le griffe','Le chat lui donne un jouet','Le chat s’endort'],0,'Le chat blesse sa main avec ses griffes.'],['Comment réagit l’enfant ?',['Il éclate de rire','Il pleure','Il danse'],1,'Il crie et sanglote.']],order:['Les personnages entrent au sanctuaire.','La mère accomplit des gestes rituels.','L’enfant tente de caresser un chat.','Le chat le griffe et il rentre à la maison.'],writing:'Raconte l’incident du chat en quatre phrases avec « d’abord », « puis », « alors » et « enfin ».'},

let state;try{state=JSON.parse(localStorage.getItem('merveilles-s8-v1'))||{done:[],answers:{},writing:{}}}catch(e){state={done:[],answers:{},writing:{}}}let page='home', lesson=0, flipped={},order=[],selected={},showResult=false,matchPick=null,matched=[],quizAnswers={};const $=s=>document.querySelector(s);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('merveilles-s8-v1',JSON.stringify(state))}catch(e){}}function nav(){const entries=[['home','Accueil'],...lessons.map((l,i)=>['l'+i,'Séance '+(i+1)])];$('#nav').innerHTML=entries.map(([id,text])=>`<button class="${(page===id||page==='lesson'&&id==='l'+lesson)?'active':''}" onclick="openPage('${id}')">${text}</button>`).join('');$('#progressbar').style.width=(state.done.length/5*100)+'%';$('#progresslabel').textContent=`Progression : ${state.done.length}/5 séances`;}function openPage(p){if(p==='home'){page='home'}else{page='lesson';lesson=Number(p.slice(1));order=lessons[lesson].order.map((_,i)=>i).sort((a,b)=>((a+2)%4)-((b+2)%4));flipped={};quizAnswers={};selected={};matched=[];matchPick=null;showResult=false}render();window.scrollTo({top:0,behavior:'instant'})}function render(){nav();if(page==='home'){home()}else{lessonPage()}}function home(){$('#main').innerHTML=`<div class="intro"><div><h2>Bonjour ! Prête à découvrir le chapitre II ?</h2><p class="muted">Lis ton roman, découvre les mots difficiles et entraîne-toi avec des petits jeux. Tu peux reprendre là où tu t’es arrêtée.</p></div><span class="pill">5 séances · 45–60 min</span></div><div class="card"><h3>Comment utiliser cette application ?</h3><p>1. Ouvre ton exemplaire du roman au chapitre II. 2. Suis les consignes de lecture. 3. Retourne les cartes de vocabulaire. 4. Réponds aux questions et joue avec les événements. 5. Complète ton petit texte.</p><p class="muted small">Cette application accompagne la lecture : elle ne remplace pas le texte original du roman. Les explications sont reformulées pour l'apprentissage.</p></div><h3>Les cinq séances</h3><div class="lesson-list">${lessons.map((l,i)=>`<button class="lesson-tile" onclick="openPage('l${i}')"><span class="tag">Séance ${i+1}</span> <span class="small muted">${l.time}</span><strong>${l.title}</strong><span class="small muted">${l.sub}</span>${state.done.includes(i)?'<div class="done">✓ Terminée</div>':''}</button>`).join('')}</div><div class="card"><h3>Pour le professeur</h3><p>La progression est gardée localement sur cet appareil. Les résultats ne sont pas envoyés à un serveur. Si les données du navigateur sont effacées, la progression peut être perdue.</p><button class="btn ghost" onclick="if(confirm('Effacer la progression de cette semaine ?')){state={done:[],answers:{},writing:{}};save();render()}">Réinitialiser la progression</button></div>`}function lessonPage(){let l=lessons[lesson];$('#main').innerHTML=`<div class="intro"><div><span class="tag">Séance ${lesson+1}/5</span><h2>${l.title}</h2><p class="muted">${l.sub} · ${l.time}</p></div><span class="pill">Chapitre II</span></div><section class="card"><h3>📖 1. Lecture accompagnée</h3><div class="reader"><strong>Dans ton livre :</strong><p>${l.read}</p></div><p><strong>À comprendre :</strong> ${l.moment}</p><div class="btn-row"><button class="btn secondary" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Aide en arabe · مساعدة</button><div hidden class="result arabic" style="width:100%">${arabicGuide[lesson]}</div></div></section><section class="card"><h3>🃏 2. Cartes de vocabulaire</h3><p class="muted small">Touche une carte pour voir la traduction en arabe et une explication simple en français.</p><div class="wordlist" id="words"></div></section><section class="card"><h3>🔗 3. Associer les mots à leur traduction</h3><p class="muted small">Choisis d’abord un mot à gauche, puis sa traduction à droite. Les paires correctes restent visibles.</p><div class="matching" id="matching"></div><div id="match-result"></div><button class="btn ghost" style="margin-top:10px" onclick="matched=[];matchPick=null;renderMatching()">Recommencer</button></section><section class="card"><h3>✅ 4. Je vérifie ma compréhension</h3><div id="questions"></div><button class="btn" onclick="checkQuiz()">Corriger mes réponses</button><div id="quiz-result"></div></section><section class="card"><h3>↕ 5. Je remets les événements dans l’ordre</h3><p class="muted small">Utilise les flèches pour remettre les scènes dans leur ordre chronologique.</p><div id="ordering"></div><button class="btn" onclick="checkOrder()">Vérifier l’ordre</button><div id="order-result"></div></section><section class="card"><h3>✍️ 6. J’écris en français</h3><p>${l.writing}</p><textarea class="input" id="writing" rows="5" placeholder="Écris ici tes phrases…" oninput="state.writing[lesson]=this.value;save()">${escapeHtml(state.writing[lesson]||'')}</textarea><p class="muted small">Relis ton texte à voix haute. Cherche un sujet, un verbe et une idée dans chaque phrase.</p></section><div class="card"><button class="btn" onclick="finish()">${state.done.includes(lesson)?'✓ Séance terminée — enregistrer à nouveau':'Marquer cette séance comme terminée ✓'}</button><div class="btn-row">${lesson>0?`<button class="btn secondary" onclick="openPage('l${lesson-1}')">← Séance précédente</button>`:''}${lesson<4?`<button class="btn secondary" onclick="openPage('l${lesson+1}')">Séance suivante →</button>`:''}</div><div id="notice" role="status"></div></div>`;renderWords();renderMatching();renderQuiz();renderOrdering()}const arabicGuide=['يحكي سيدي محمد عن يوم الثلاثاء الذي يخافه بسبب الكُتّاب وشدة الفقيه. يشعر بالخوف بعد أحلام مزعجة.','تقترح للا عائشة زيارة ضريح سيدي علي بوغالب، فتستعد الأم ويرافقهما الطفل وسط شوارع مزدحمة.','في الضريح تقوم الأم بطقوس وتدعو. يقترب الطفل من قط، فيخدشه ويبدأ بالبكاء.','بعد العودة إلى المنزل يرتاح الطفل. يتخيل أنه يفهم لغة العصافير، ويسمع حديث نساء الدار.','نراجع تسلسل أحداث الفصل الثاني، والشخصيات، والمشاعر، ثم نكتب ملخصاً قصيراً باللغة الفرنسية.'];function renderWords(){$('#words').innerHTML=lessons[lesson].words.map(([f,a,d],i)=>`<button class="word ${flipped[i]?'flipped':''}" onclick="flipped[${i}]=!flipped[${i}];renderWords()"><strong>${flipped[i]?`<span class="arabic">${a}</span>`:escapeHtml(f)}</strong><span class="hint">${flipped[i]?escapeHtml(d):'Toucher pour traduire ↻'}</span></button>`).join('')}function renderMatching(){let pairs=lessons[lesson].words.slice(0,5),perm=[2,4,0,3,1];$('#matching').innerHTML=`<div>${pairs.map(([f],i)=>`<button class="choice ${matched.includes(i)?'linked':''} ${matchPick===i?'selected':''}" ${matched.includes(i)?'disabled':''} onclick="matchPick=${i};renderMatching()">${escapeHtml(f)} ${matched.includes(i)?'✓':''}</button>`).join('')}</div><div>${perm.map(i=>`<button class="choice ${matched.includes(i)?'linked':''}" ${matched.includes(i)?'disabled':''} onclick="tryMatch(${i})"><span class="arabic">${pairs[i][1]}</span> ${matched.includes(i)?'✓':''}</button>`).join('')}</div>`;$('#match-result').textContent=`${matched.length} / 5 associations réussies`;}function tryMatch(i){if(matchPick===null){$('#match-result').textContent='Choisis d’abord un mot français.';return}if(matchPick===i){matched.push(i);matchPick=null;renderMatching();if(matched.length===5)$('#match-result').innerHTML='<div class="result ok">Bravo ! Toutes les associations sont correctes.</div>'}else{$('#match-result').innerHTML='<div class="result bad">Essaie encore : cette traduction ne correspond pas au mot choisi.</div>'}}function renderQuiz(){$('#questions').innerHTML=lessons[lesson].questions.map((q,i)=>`<div class="q"><strong>${i+1}. ${q[0]}</strong><div class="choices">${q[1].map((c,j)=>`<button class="choice ${quizAnswers[i]===j?'selected':''}" onclick="quizAnswers[${i}]=${j};renderQuiz()">${c}</button>`).join('')}</div></div>`).join('')}function checkQuiz(){let qs=lessons[lesson].questions,n=qs.filter((q,i)=>quizAnswers[i]===q[2]).length;$('#quiz-result').innerHTML=`<div class="result ${n===qs.length?'ok':''}"><strong>${n}/${qs.length} bonnes réponses</strong>${qs.map((q,i)=>`<p class="small">${quizAnswers[i]===q[2]?'✓':'✗'} Q${i+1} : ${q[3]}</p>`).join('')}</div>`;state.answers[lesson]=n;save()}function renderOrdering(){$('#ordering').innerHTML=order.map((id,i)=>`<div class="chip"><span><b>${i+1}.</b> ${lessons[lesson].order[id]}</span><span class="arrows"><button aria-label="Monter" class="arrow" ${i===0?'disabled':''} onclick="moveOrder(${i},-1)">↑</button><button aria-label="Descendre" class="arrow" ${i===3?'disabled':''} onclick="moveOrder(${i},1)">↓</button></span></div>`).join('')}function moveOrder(i,d){[order[i],order[i+d]]=[order[i+d],order[i]];renderOrdering();$('#order-result').textContent=''}function checkOrder(){let correct=order.every((x,i)=>x===i);$('#order-result').innerHTML=`<div class="result ${correct?'ok':'bad'}">${correct?'Bravo ! Les événements sont dans le bon ordre.':'Ce n’est pas encore le bon ordre. Relis la scène et recommence.'}</div>`}function finish(){if(!state.done.includes(lesson))state.done.push(lesson);save();nav();$('#notice').innerHTML='<div class="result ok">Séance enregistrée ! Tu peux passer à la suivante.</div>'}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
